<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>Todo</h1>
        <p class="subtitle">Manage tasks — add, edit, complete, reorder</p>
      </header>

      <section class="new-todo">
        <input id="todoInput" type="text" placeholder="What needs to be done?" aria-label="New todo" />
        <button id="addBtn" aria-label="Add todo">Add</button>
      </section>

      <section class="controls">
        <div class="filters" role="tablist" aria-label="Filter todos">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
        <button id="clearCompleted">Clear Completed</button>
      </section>

      <section class="list-wrap">
        <ul id="todoList" class="todo-list"></ul>
      </section>

      <footer class="footer">
        <span id="count" class="count">0 items left</span>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
